name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare credentials
        run: |
          missing=0

          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Missing production secret: CLOUDFLARE_API_TOKEN"
            missing=1
          fi

          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Missing production secret or variable: CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi

          if [[ -z "$VITE_API_BASE_URL" ]]; then
            echo "::error::Missing production variable or secret: VITE_API_BASE_URL"
            missing=1
          elif [[ ! "$VITE_API_BASE_URL" =~ ^https:// ]]; then
            echo "::error::VITE_API_BASE_URL must use HTTPS in production"
            missing=1
          fi

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Deploy
        run: npx wrangler deploy
